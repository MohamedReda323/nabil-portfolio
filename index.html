<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إضافية التصاميم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
            text-align: center;
        }

        .admin-box {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="admin-box">
        <h2>إضافة تصميم جديد</h2>
        <input type="text" id="designTitle" placeholder="عنوان التصميم (مثلاً: هوية بصرية لشركة)">
        <textarea id="designDesc" placeholder="وصف التصميم والتقنيات..."></textarea>
        <input type="file" id="designImage" accept="image/*">
        <button onclick="uploadDesign()">رفع ونشر التصميم</button>
        <p id="status"></p>
    </div>

    <script>
        async function uploadDesign() {
            const title = document.getElementById('designTitle').value;
            const desc = document.getElementById('designDesc').value;
            const fileInput = document.getElementById('designImage');
            const status = document.getElementById('status');

            if (!title || fileInput.files.length === 0) {
                alert('من فضلك اكتب العنوان واختر الصورة!');
                return;
            }

            status.innerText = 'جاري رفع الصورة ونشرها... ⏳';

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                // نستخدم خدمة ImgBB المجانية لرفع الصورة واستخراج رابط مباشر لها
                const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e021577759247d519d08e709e99', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.url;

                    // جلب التصاميم القديمة من التخزين المحلي للمتصفح
                    let designs = JSON.parse(localStorage.getItem('nabil_designs')) || [];

                    // إضافة التصميم الجديد للقائمة
                    designs.unshift({ title, desc, url: imageUrl });

                    // حفظ القائمة المحدثة
                    localStorage.setItem('nabil_designs', JSON.stringify(designs));

                    status.innerText = 'تم النشر بنجاح! 🎉 حدد صفحة الموقع الرئيسية لرؤية التغيير.';
                    document.getElementById('designTitle').value = '';
                    document.getElementById('designDesc').value = '';
                    fileInput.value = '';
                } else {
                    status.innerText = 'فشل الرفع، حاول مرة أخرى.';
                }
            } catch (error) {
                status.innerText = 'حدث خطأ في الاتصال.';
                console.error(error);
            }
        }
    </script>
</body>

</html>
