<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المحمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
            text-align: center;
        }

        .box {
            max-width: 400px;
            margin: 80px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .password-container {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        .password-container input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin: 0;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            width: auto;
            margin: 0;
            padding: 0;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        input[type="text"]:not(#adminPassword),
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        button.action-btn:hover {
            background: #0ea5e9;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #f87171 !important;
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="box">
        <h2>تسجيل دخول الإدارة</h2>
        <div class="password-container">
            <input type="password" id="adminPassword" placeholder="اكتب كلمة المرور">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>
        <button class="action-btn" onclick="checkPassword()">دخول</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- لوحة التحكم الفعلية (للرفع) -->
    <div id="admin-panel" class="box hidden" style="max-width: 500px;">
        <h2>إضافة تصميم جديد</h2>
        <input type="text" id="designTitle" placeholder="عنوان التصميم">
        <textarea id="designDesc" placeholder="وصف التصميم والتقنيات..."></textarea>
        <input type="file" id="designImage" accept="image/*">
        <button class="action-btn" onclick="uploadDesign()">رفع ونشر التصميم</button>
        <p id="status"></p>
    </div>

    <script>
        const CORRECT_PASSWORD = "nabil123";

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value.trim();
            const errorText = document.getElementById('login-error');

            if (pass === CORRECT_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                errorText.innerText = '❌ كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        async function uploadDesign() {
            const title = document.getElementById('designTitle').value;
            const desc = document.getElementById('designDesc').value;
            const fileInput = document.getElementById('designImage');
            const status = document.getElementById('status');

            if (!title || fileInput.files.length === 0) {
                alert('من فضلك اكتب العنوان واختر الصورة!');
                return;
            }

            status.innerText = 'جاري رفع الصورة ونشرها... ⏳';

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('https://api.imgbb.com/1/upload?key=6d207e021577759247d519d08e709e99', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    const imageUrl = data.data.url;
                    let allDesigns = JSON.parse(localStorage.getItem('nabil_designs')) || [];
                    allDesigns.unshift({ title, desc, url: imageUrl });
                    localStorage.setItem('nabil_designs', JSON.stringify(allDesigns));

                    status.innerText = 'تم النشر بنجاح! 🎉 حدد صفحة الموقع الرئيسية لرؤية التغيير.';
                    document.getElementById('designTitle').value = '';
                    document.getElementById('designDesc').value = '';
                    fileInput.value = '';
                } else {
                    status.innerText = 'فشل الرفع، حاول مرة أخرى.';
                }
            } catch (error) {
                status.innerText = 'حدث خطأ في الاتصال.';
                console.error(error);
            }
        }
    </script>
</body>

</html>
