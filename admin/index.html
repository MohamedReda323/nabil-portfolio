<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المحمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
            text-align: center;
        }

        .box {
            max-width: 400px;
            margin: 80px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #f87171 !important;
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="box">
        <h2>تسجيل دخول الإدارة</h2>
        <input type="password" id="adminPassword" placeholder="اكتب كلمة المرور">
        <button onclick="checkPassword()">دخول</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- لوحة التحكم الفعلية (مخفية لحين كتابة الباسورد) -->
    <div id="admin-panel" class="box hidden" style="max-width: 500px;">
        <h2>إضافة تصميم جديد</h2>
        <input type="text" id="designTitle" placeholder="عنوان التصميم">
        <textarea id="designDesc" placeholder="وصف التصميم والتقنيات..."></textarea>
        <input type="file" id="designImage" accept="image/*">
        <button onclick="uploadDesign()">رفع ونشر التصميم</button>
        <p id="status"></p>
    </div>

    <!-- ربط السكريبت الخارجي -->
    <script src="admin-script.js"></script>
</body>

</html>
