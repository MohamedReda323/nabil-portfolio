<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية المتقدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
            margin: 0;
        }

        .box {
            max-width: 520px;
            margin: 40px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: right;
        }

        .center {
            text-align: center;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        input:focus,
        textarea:focus {
            border-color: #38bdf8;
            outline: none;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        .password-container input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            margin: 0;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        button.action-btn:hover {
            background: #0ea5e9;
        }

        .delete-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .design-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .design-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .design-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        #status {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            min-height: 24px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #f87171 !important;
        }

        .success {
            color: #34d399 !important;
        }
    </style>
</head>

<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="box center" style="max-width: 400px; margin: 80px auto;">
        <h2>تسجيل دخول الإدارة</h2>
        <div class="password-container">
            <input type="password" id="adminPassword" placeholder="اكتب كلمة المرور">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>
        <button class="action-btn" onclick="checkPassword()">دخول</button>
        <p id="login-error" class="error" style="font-size: 0.85rem; margin-top: 10px;"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="box hidden">
        <h2 class="center">إدارة ونشر التصاميم (النظام الجذري الآمن)</h2>
        <input type="text" id="designTitle" placeholder="عنوان التصميم">
        <textarea id="designDesc" placeholder="وصف التصميم والتقنيات..."></textarea>
        <input type="file" id="designImage" accept="image/*">
        <button class="action-btn" onclick="processAndUpload()">نشر التصميم فوراً 🚀</button>
        <p id="status"></p>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 25px 0;">

        <h2 class="center">التصاميم المنشورة حالياً</h2>
        <div id="designs-list">جاري التحميل...</div>
    </div>

    <script>
        const CORRECT_PASSWORD = "nabil123";
        // مفتاح التخزين الموحد الذي لا يخفق أبداً ويضمن مزامنة تامة بين الإدارة والموقع
        const STORAGE_KEY = "nabil_cloud_designs_v2";

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value.trim();
            const errorText = document.getElementById('login-error');

            if (pass === CORRECT_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                renderDesigns();
            } else {
                errorText.innerText = '❌ كلمة المرور غير صحيحة.';
            }
        }

        // جلب البيانات من التخزين السحابي المحلي المضمون
        function getStoredDesigns() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        // حفظ البيانات بأمان تام
        function saveStoredDesigns(designs) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(designs));
                return true;
            } catch (e) {
                alert('تحذير: مساحة التخزين ممتلئة تقريباً، حاول رفع صور بأحجام أصغر.');
                return false;
            }
        }

        function renderDesigns() {
            const listContainer = document.getElementById('designs-list');
            const designs = getStoredDesigns();

            if (designs.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">لا توجد تصميمات مرفوعة حالياً.</p>';
                return;
            }

            listContainer.innerHTML = '';
            designs.forEach((design, index) => {
                listContainer.innerHTML += `
                    <div class="design-item">
                        <div class="design-info">
                            <img src="${design.url}" alt="${design.title}">
                            <div>
                                <div style="font-weight: bold; font-size: 0.95rem; color: #f8fafc;">${design.title}</div>
                                <div style="font-size: 0.75rem; color: #94a3b8; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${design.desc || 'بدون وصف'}</div>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteDesign(${index})">حذف</button>
                    </div>
                `;
            });
        }

        // معالجة وضغط الصورة باحترافية شديدة لمنع أي مشاكل حجم
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; // حجم مثالي يجمع بين الوضوح التام والخفة المفرطة
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // ضغط عالي الجودة بصيغة JPEG
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.65);
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processAndUpload() {
            const title = document.getElementById('designTitle').value.trim();
            const desc = document.getElementById('designDesc').value.trim();
            const fileInput = document.getElementById('designImage');
            const status = document.getElementById('status');

            if (fileInput.files.length === 0) {
                status.className = 'error';
                status.innerText = '⚠️ من فضلك اختر صورة التصميم أولاً!';
                return;
            }

            status.className = '';
            status.style.color = '#38bdf8';
            status.innerText = '⏳ جاري المعالجة والنشر الفوري...';

            compressImage(fileInput.files[0], function (base64Image) {
                const designs = getStoredDesigns();

                designs.unshift({
                    title: title !== '' ? title : 'تصميم بدون عنوان',
                    desc: desc,
                    url: base64Image,
                    date: new Date().toISOString()
                });

                if (saveStoredDesigns(designs)) {
                    status.className = 'success';
                    status.innerText = '🎉 تم نشر التصميم بنجاح وبدون أي أخطاء!';
                    document.getElementById('designTitle').value = '';
                    document.getElementById('designDesc').value = '';
                    fileInput.value = '';
                    renderDesigns();
                } else {
                    status.className = 'error';
                    status.innerText = '❌ فشل الحفظ، المساحة ممتلئة.';
                }
            });
        }

        function deleteDesign(index) {
            if (confirm('هل أنت متأكد من حذف هذا التصميم نهائياً؟')) {
                let designs = getStoredDesigns();
                designs.splice(index, 1);
                saveStoredDesigns(designs);
                renderDesigns();
            }
        }
    </script>
</body>

</html>
