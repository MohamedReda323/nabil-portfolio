<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: right;
        }

        .center {
            text-align: center;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        .password-container input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            margin: 0;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        button.action-btn:hover {
            background: #0ea5e9;
        }

        .delete-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .design-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .design-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .design-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #38bdf8;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #f87171 !important;
            font-size: 0.85rem;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="box center" style="max-width: 400px; margin: 80px auto;">
        <h2>تسجيل دخول الإدارة</h2>
        <div class="password-container">
            <input type="password" id="adminPassword" placeholder="اكتب كلمة المرور">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>
        <button class="action-btn" onclick="checkPassword()">دخول</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- لوحة التحكم السحابية -->
    <div id="admin-panel" class="box hidden">
        <h2 class="center">إضافة تصميم جديد (سحابي)</h2>
        <input type="text" id="designTitle" placeholder="عنوان التصميم">
        <textarea id="designDesc" placeholder="وصف التصميم والتقنيات..."></textarea>
        <input type="file" id="designImage" accept="image/*">
        <button class="action-btn" onclick="uploadDesignCloud()">رفع ونشر سحابياً</button>
        <p id="status"></p>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 25px 0;">

        <h2 class="center">إدارة التصاميم السحابية</h2>
        <div id="designs-list">جاري تحميل التصاميم...</div>
    </div>

    <script>
        const CORRECT_PASSWORD = "nabil123";

        // بيانات السحابة الخاصة بك
        const BIN_ID = "6a90da54f5f4af5e294bdd8f";
        const API_KEY = "$2a$10$4wACAkCehi/kP0C.y2pnZO01Awruy6s95q/NLDwvyobT0nZCoaFu";

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value.trim();
            const errorText = document.getElementById('login-error');

            if (pass === CORRECT_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminDesignsCloud();
            } else {
                errorText.innerText = '❌ كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        // تحميل التصاميم من السحابة للوحة التحكم
        async function loadAdminDesignsCloud() {
            const listContainer = document.getElementById('designs-list');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                let allDesigns = data.record || [];

                if (allDesigns.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">لا توجد تصميمات مرفوعة حالياً.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                allDesigns.forEach((design, index) => {
                    listContainer.innerHTML += `
                        <div class="design-item">
                            <div class="design-info">
                                <img src="${design.url}" alt="${design.title}">
                                <div>
                                    <div style="font-weight: bold; font-size: 0.95rem;">${design.title}</div>
                                    <div style="font-size: 0.75rem; color: #94a3b8; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${design.desc || ''}</div>
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteDesignCloud(${index})">حذف</button>
                        </div>
                    `;
                });
            } catch (e) {
                listContainer.innerHTML = '<p class="error">فشل تحميل التصاميم من السحابة.</p>';
            }
        }

        // رفع تصميم جديد للسحابة
        async function uploadDesignCloud() {
            const title = document.getElementById('designTitle').value.trim();
            const desc = document.getElementById('designDesc').value.trim();
            const fileInput = document.getElementById('designImage');
            const status = document.getElementById('status');

            if (fileInput.files.length === 0) {
                alert('من فضلك اختر الصورة أولاً!');
                return;
            }

            status.innerText = 'جاري الرفع للسحابة... ⏳';

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function (event) {
                const base64Image = event.target.result;

                try {
                    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': API_KEY }
                    });
                    const getData = await getRes.json();
                    let allDesigns = getData.record || [];

                    allDesigns.unshift({
                        title: title !== '' ? title : 'تصميم بدون عنوان',
                        desc: desc,
                        url: base64Image
                    });

                    const updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY
                        },
                        body: JSON.stringify(allDesigns)
                    });

                    if (updateRes.ok) {
                        status.innerText = 'تم النشر سحابياً بنجاح! 🎉';
                        document.getElementById('designTitle').value = '';
                        document.getElementById('designDesc').value = '';
                        fileInput.value = '';
                        loadAdminDesignsCloud();
                    } else {
                        status.innerText = 'فشل التحديث على السحابة.';
                    }
                } catch (err) {
                    status.innerText = 'حدث خطأ في الاتصال بالإنترنت.';
                }
            };
            reader.readAsDataURL(file);
        }

        // حذف تصميم من السحابة
        async function deleteDesignCloud(index) {
            if (confirm('هل أنت متأكد من حذف هذا التصميم نهائياً من الموقع لكل الزوار؟')) {
                try {
                    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': API_KEY }
                    });
                    const getData = await getRes.json();
                    let allDesigns = getData.record || [];

                    allDesigns.splice(index, 1);

                    const updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY
                        },
                        body: JSON.stringify(allDesigns)
                    });

                    if (updateRes.ok) {
                        loadAdminDesignsCloud();
                    }
                } catch (e) {
                    alert('حدث خطأ أثناء الحذف.');
                }
            }
        }
    </script>
</body>

</html>
